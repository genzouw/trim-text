# lychee (リンクチェッカー) の設定。
# .github/workflows/lychee.yml から参照される。

# ブラウザ以外からのアクセスを拒否するサイトは、リンク自体が有効でも CI から
# 到達性を検証できないため、チェック対象から除外する。
exclude = [
  # LinkedIn は bot からのリクエストに対して HTTP 999 を返す。
  '^https://www\.linkedin\.com/',
  # scorecard.dev は GitHub Actions ランナーからの接続を断続的に拒否し、
  # リトライを緩めても解消しないため、到達性検証の対象から除外する。
  '^https://scorecard\.dev/',
]
