name: free-policy

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
# 必須チェック (context: "free-policy / Free-only policy check") のため paths フィルタ禁止
# (フィルタで skip されると context が報告されずマージできなくなる)。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: free-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  free-policy:
    # enforce は既定の true。AGENTS.md のコスト方針に反する設定を検出した PR は job が失敗する。
    uses: genzouw/ci-workflows/.github/workflows/free-policy.yml@df797c6bf62f8bbcfc4c0ccb9325e06bd5da8f01 # v1.5.6
    with:
      # GitHub 自身の資格情報だけを許可する (課金 API には繋がらない)。
      # 有料 SaaS の鍵はここへ足さない (#271)。
      allowed_secrets: | # pragma: allowlist secret
        REVIEWDOG_GITHUB_API_TOKEN
