name: Test Results

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - Test
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Test Results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # bats がテスト失敗しても結果は公開したいが、workflow がキャンセル・
    # スキップされた場合は artifact が存在しないため実行しない。
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    permissions:
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      # Test workflow (test.yml) が upload した Event File / Test Results
      # artifact を、書き込み権限を持つこの workflow_run 側の job から取得する。
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          # push と pull_request の両方で起動されるため、check_name に
          # イベント名を含めて check run が上書きされないようにする。
          check_name: "Test Results (${{ github.event.workflow_run.event }})"
          files: "artifacts/**/*.xml"
