name: Test Results

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - Test
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.event }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Test Results
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # bats がテスト失敗しても結果は公開したいが、workflow がキャンセル・
    # スキップされた場合は artifact が存在しないため実行しない。
    if: >
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    permissions:
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Test workflow (test.yml) が upload した Event File / Test Results
      # artifact を、書き込み権限を持つこの workflow_run 側の job から取得する。
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/Event File/event.json
          event_name: ${{ github.event.workflow_run.event }}
          # push と pull_request の両方で起動されるため、check_name に
          # イベント名を含めて check run が上書きされないようにする。
          check_name: "Test Results (${{ github.event.workflow_run.event }})"
          files: "artifacts/**/*.xml"
