name: AI PR Translator

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  models: read

jobs:
  translate:
    name: Translate PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Create Prompt File
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          cat << AI_PR_TRANSLATOR_PROMPT_EOF > prompt.txt
          以下のPull Requestのタイトルと本文が日本語以外の言語で書かれているか判定し、日本語以外の場合は日本語に翻訳してください。

          【指示】
          1. PRがすでに日本語で書かれている場合（大部分が日本語の場合）は、何も出力しないでください。空白または改行のみを出力してください。
          2. 日本語以外の言語（例：英語、中国語など）で書かれている場合は、タイトルと本文を日本語に翻訳して出力してください。
          3. 出力フォーマットは以下のようにしてください（マークダウン形式）。

          **【AIによる自動翻訳 / AI Auto Translation】**

          ### タイトル / Title
          <翻訳されたタイトル>

          ### 本文 / Body
          <翻訳された本文>

          ---
          *Note: This is an automated translation generated by AI.*

          【Pull Request タイトル】
          ${PR_TITLE}

          【Pull Request 本文】
          ${PR_BODY}
          AI_PR_TRANSLATOR_PROMPT_EOF

      - name: Run AI Inference
        id: inference
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          model: openai/gpt-4o-mini
          max-completion-tokens: 4096
          prompt-file: prompt.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          # 翻訳が必要ないと判定された場合（レスポンスが空の場合）はそのまま終了
          if [ -z "$(printf '%s\n' "${AI_RESPONSE}" | tr -d '[:space:]')" ]; then
            echo "PR is already in Japanese or no translation needed."
          else
            MARKER="<!-- ai-pr-translator -->"
            COMMENT_BODY="${MARKER}
            ${AI_RESPONSE}
            "

            # 既存の翻訳コメントがあるか確認
            EXISTING_COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // empty")

            if [ -n "${EXISTING_COMMENT_ID}" ]; then
              # 既存コメントを更新
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" -f body="${COMMENT_BODY}" || echo "Failed to update comment"
            else
              # 新規コメントを作成
              gh pr comment "${PR_NUMBER}" --body "${COMMENT_BODY}" || echo "Failed to post comment"
            fi
          fi
