name: shellcheck

# 本ワークフローは genzouw/ci-workflows の reusable workflow を呼び出す薄いスタブ。
# ロジックの実体・変更は ci-workflows 側で一元管理する (トリガー定義のみここで持つ)。
# 参照 SHA の更新は Renovate (github-actions manager) が自動で PR を出す。
on:
  push:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/actions/**'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.sh'
      - '.github/actions/**'
      - '.github/workflows/shellcheck.yml'

concurrency:
  group: shellcheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    # shellcheck の版は ci-workflows 側の既定値 (0.11.0) に委ねる。v1.5.6 から、ランナー同梱版ではなく
    # SHA256 検証つきの固定版を使う (genzouw/ci-workflows#59)。
    # pre-commit のフック (.pre-commit-config.yaml の rev) および lint.yml の SHELLCHECK_VERSION と同じ版に揃える (#269)。
    uses: genzouw/ci-workflows/.github/workflows/shellcheck.yml@b6a71471033888f2d8c59b882e4659f1f1121d18 # v1.5.8
