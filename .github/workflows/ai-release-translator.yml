name: AI Release Translator

on:
  release:
    types: [published, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.id }}
  cancel-in-progress: true

permissions:
  contents: write
  models: read

jobs:
  translate:
    name: Translate Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Create Prompt File
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail

          {
            cat << 'AI_TRANSLATOR_PROMPT_EOF'
          以下のGitHub Releaseのタイトルと本文が日本語以外の言語で書かれているか判定し、日本語以外の場合は日本語に翻訳してください。

          【指示】
          1. Releaseがすでに日本語で書かれている場合（大部分が日本語の場合）は、何も出力しないでください。空白または改行のみを出力してください。
          2. 日本語以外の言語（例：英語、中国語など）で書かれている場合は、タイトルと本文を日本語に翻訳して出力してください。
          3. 出力フォーマットは以下のようにしてください（マークダウン形式）。

          **【AIによる自動翻訳 / AI Auto Translation】**

          ### リリース名 / Release Name
          <翻訳されたリリース名>

          ### リリースノート / Release Notes
          <翻訳されたリリースノート>

          ---
          *Note: This is an automated translation generated by AI.*

          【Release Name】
          AI_TRANSLATOR_PROMPT_EOF

            printf '%s\n\n' "${RELEASE_NAME}"
            echo '【Release Notes】'
            printf '%s\n' "${RELEASE_BODY}"
          } > prompt.txt

      - name: Run AI Inference
        id: inference
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          model: openai/gpt-4o-mini
          prompt-file: prompt.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          AI_RESPONSE: ${{ steps.inference.outputs.response }}
          ORIGINAL_BODY: ${{ github.event.release.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 翻訳が必要ないと判定された場合（レスポンスが空の場合）はそのまま終了
          if [ -z "$(echo "${AI_RESPONSE}" | tr -d '[:space:]')" ]; then
            echo "Release is already in Japanese or no translation needed."
          else
            MARKER="<!-- ai-release-translator -->"

            if grep -q "${MARKER}" <<< "${ORIGINAL_BODY}"; then
              echo "Release note has already been translated."
            else
              printf '%s\n\n%s\n%s\n' "${ORIGINAL_BODY}" "${MARKER}" "${AI_RESPONSE}" > new_release_body.md
              gh release edit "${RELEASE_TAG}" --repo "${REPO}" --notes-file new_release_body.md || echo "Failed to update release notes"
            fi
          fi
