# gitStream による PR パイプライン自動化
# LinearB サービスが workflow_dispatch 経由でトリガーし、CM ルールを評価・実行する
name: gitStream workflow automation
run-name: |
  gitStream: PR #${{ fromJSON(fromJSON(github.event.inputs.client_payload)).pullRequestNumber }} from ${{ github.event.inputs.full_repository }}

on:
  workflow_dispatch:
    inputs:
      client_payload:
        description: The Client payload
        required: true
      full_repository:
        description: The repository name in `owner/repo_name` format
        required: true
      head_ref:
        description: The head sha
        required: true
      base_ref:
        description: The base ref
        required: true
      installation_id:
        description: The installation id
        required: false
      resolver_url:
        description: The resolver url to pass results to
        required: true
      resolver_token:
        description: Optional resolver token for resolver service
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ fromJSON(fromJSON(github.event.inputs.client_payload)).pullRequestNumber || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitStream:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    name: gitStream workflow automation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Evaluate PR
        uses: linear-b/gitstream-github-action@ad50020e7dd21f55d52d4fa899725650724c3ebf # 2.0.278
        id: rules-engine
        with:
          full_repository: ${{ github.event.inputs.full_repository }}
          head_ref: ${{ github.event.inputs.head_ref }}
          base_ref: ${{ github.event.inputs.base_ref }}
          client_payload: ${{ github.event.inputs.client_payload }}
          installation_id: ${{ github.event.inputs.installation_id }}
          resolver_url: ${{ github.event.inputs.resolver_url }}
          resolver_token: ${{ github.event.inputs.resolver_token }}
