name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    name: bats (tt の境界値・ランダム入力テスト)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BATS_VERSION: 1.11.0
      # bats-core v1.11.0 tar.gz の公式 SHA256
      BATS_SHA256: aeff09fdc8b0c88b3087c99de00cf549356d7a2f6a69e3fcec5e0e861d2f9063
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup bats
        uses: ./.github/actions/setup-bats
        with:
          version: ${{ env.BATS_VERSION }}
          sha256: ${{ env.BATS_SHA256 }}

      - name: Run bats
        run: |
          mkdir -p test-results
          # --report-formatter junit is required to generate the report file correctly in the specified output directory.
          bats --report-formatter junit --output test-results/ tests/

      # フォーク PR / Dependabot PR は読み取り専用の GITHUB_TOKEN しか持たず、
      # この job で直接 Publish Test Results を実行すると
      # Resource not accessible by integration で失敗する。
      # 結果と event file を artifact として保存し、書き込み権限を持つ
      # test-results.yml (workflow_run トリガー) 側で公開する。
      - name: Upload event file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Event File
          path: ${{ github.event_path }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test Results
          path: test-results/**/*.xml
