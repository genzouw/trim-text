name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    name: bats (tt の境界値・ランダム入力テスト)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      BATS_VERSION: 1.11.0
      # bats-core v1.11.0 tar.gz の公式 SHA256
      BATS_SHA256: aeff09fdc8b0c88b3087c99de00cf549356d7a2f6a69e3fcec5e0e861d2f9063
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup bats
        uses: ./.github/actions/setup-bats
        with:
          version: ${{ env.BATS_VERSION }}
          sha256: ${{ env.BATS_SHA256 }}

      - name: Run bats
        run: |
          mkdir -p test-results
          # --report-formatter junit is required to generate the report file correctly in the specified output directory.
          bats --report-formatter junit --output test-results/ tests/

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@170bf24d20d201b842d7a52403b73ed297e6645b # v2.18.0
        if: always()
        with:
          files: "test-results/**/*.xml"
