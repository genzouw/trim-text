name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # reviewdog のバージョンは再現性確保のため固定する。
  REVIEWDOG_VERSION: 0.21.0
  # reviewdog v0.21.0 linux_amd64 の公式 SHA256
  # https://github.com/reviewdog/reviewdog/releases/tag/v0.21.0
  REVIEWDOG_SHA256: ad5ce7d5ffa52aaa7ec8710a8fa764181b6cecaab843cc791e1cce1680381569

permissions:
  contents: read

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sh: ${{ steps.filter.outputs.sh }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      gha: ${{ steps.filter.outputs.gha }}
      yaml_files: ${{ steps.filter.outputs.yaml_files }}
      md: ${{ steps.filter.outputs.md }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Paths Filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            sh:
              - '**/*.sh'
              - 'tt'
            dockerfile:
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '.hadolint.yaml'
            gha:
              - '.github/workflows/**/*.yml'
              - '.github/workflows/**/*.yaml'
              - '.github/actions/**/*.yml'
              - '.github/actions/**/*.yaml'
              - '.github/scripts/**'
            yaml_files:
              - '**/*.yml'
              - '**/*.yaml'
              - '.yamllint.yaml'
            md:
              - '**/*.md'
              - '.textlintrc.json'

  shellcheck:
    needs: changes
    # ワークフロー/ローカルActionの変更でも自身のロジック変化を検知できるよう、
    # gha（CI定義の変更）でも実行対象にする。
    if: ${{ needs.changes.outputs.sh == 'true' || needs.changes.outputs.gha == 'true' }}
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # reviewdog による PR レビューコメント投稿のための最小権限。
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup reviewdog
        uses: ./.github/actions/setup-reviewdog
        with:
          version: ${{ env.REVIEWDOG_VERSION }}
          sha256: ${{ env.REVIEWDOG_SHA256 }}

      - name: Run ShellCheck with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shellcheck -f checkstyle tt | "${RUNNER_TEMP}/reviewdog" -f=checkstyle -name="shellcheck" -reporter="github-pr-review" -level="warning" -fail-on-error="true"

  shfmt:
    needs: changes
    # ワークフロー/ローカルActionの変更でも自身のロジック変化を検知できるよう、
    # gha（CI定義の変更）でも実行対象にする。
    if: ${{ needs.changes.outputs.sh == 'true' || needs.changes.outputs.gha == 'true' }}
    name: shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # reviewdog を使わず差分表示のみのため、書き込み権限は不要。
    permissions:
      contents: read
    env:
      SHFMT_VERSION: 3.10.0
      # shfmt v3.10.0 linux_amd64 の公式 SHA256
      # https://github.com/mvdan/sh/releases/tag/v3.10.0
      SHFMT_SHA256: 1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup shfmt
        uses: ./.github/actions/setup-shfmt
        with:
          version: ${{ env.SHFMT_VERSION }}
          sha256: ${{ env.SHFMT_SHA256 }}

      - name: Run shfmt
        run: |
          "${RUNNER_TEMP}/shfmt" -d -i 2 -ci tt

  hadolint:
    needs: changes
    # ワークフロー/ローカルActionの変更でも自身のロジック変化を検知できるよう、
    # gha（CI定義の変更）でも実行対象にする。
    if: ${{ needs.changes.outputs.dockerfile == 'true' || needs.changes.outputs.gha == 'true' }}
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # reviewdog による PR レビューコメント投稿のための最小権限。
    permissions:
      contents: read
      pull-requests: write
    env:
      HADOLINT_VERSION: v2.12.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup hadolint
        uses: ./.github/actions/setup-hadolint
        with:
          version: ${{ env.HADOLINT_VERSION }}

      - name: Setup reviewdog
        uses: ./.github/actions/setup-reviewdog
        with:
          version: ${{ env.REVIEWDOG_VERSION }}
          sha256: ${{ env.REVIEWDOG_SHA256 }}

      - name: Run hadolint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "${RUNNER_TEMP}/hadolint" -f tty Dockerfile | "${RUNNER_TEMP}/reviewdog" -efm="%f:%l %m" -name="hadolint" -reporter="github-pr-review" -level="warning" -fail-on-error="true"

  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.gha == 'true' }}
    name: actionlint (GitHub Actions workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # reviewdog による PR レビューコメント投稿のための最小権限。
    permissions:
      contents: read
      pull-requests: write
    env:
      ACTIONLINT_VERSION: 1.7.7
      # actionlint v1.7.7 linux_amd64 の公式 SHA256
      # https://github.com/rhysd/actionlint/releases/tag/v1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup actionlint
        uses: ./.github/actions/setup-actionlint
        with:
          version: ${{ env.ACTIONLINT_VERSION }}
          sha256: ${{ env.ACTIONLINT_SHA256 }}

      - name: Setup reviewdog
        uses: ./.github/actions/setup-reviewdog
        with:
          version: ${{ env.REVIEWDOG_VERSION }}
          sha256: ${{ env.REVIEWDOG_SHA256 }}

      - name: Run actionlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "${RUNNER_TEMP}/actionlint" -oneline -ignore 'unknown permission scope "models"' | "${RUNNER_TEMP}/reviewdog" -efm="%f:%l:%c: %m" -name="actionlint" -reporter="github-pr-review" -level="warning" -fail-on-error="true"

      - name: Verify action pins resolve to commit SHAs
        env:
          # annotated tag object SHA を誤って pin した場合に startup_failure を防ぐ。
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/verify-action-pins.sh

  editorconfig:
    # 全ファイルが対象のため changes job による選別は行わず常に実行する。
    name: editorconfig-checker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # reviewdog による PR レビューコメント投稿のための最小権限。
    permissions:
      contents: read
      pull-requests: write
    env:
      EC_VERSION: 3.8.0
      # editorconfig-checker v3.8.0 linux_amd64 の公式 SHA256
      EC_SHA256: 613bd88f34165a334adcb6b7e92a123c9de0eada65846d31af63613b779ff3be
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup editorconfig-checker
        uses: ./.github/actions/setup-editorconfig-checker
        with:
          version: ${{ env.EC_VERSION }}
          sha256: ${{ env.EC_SHA256 }}

      - name: Setup reviewdog
        uses: ./.github/actions/setup-reviewdog
        with:
          version: ${{ env.REVIEWDOG_VERSION }}
          sha256: ${{ env.REVIEWDOG_SHA256 }}

      - name: Run editorconfig-checker with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "${RUNNER_TEMP}/editorconfig-checker/bin/ec-linux-amd64" -format gcc | "${RUNNER_TEMP}/reviewdog" -efm="%f:%l:%c: %m" -name="editorconfig" -reporter="github-pr-review" -level="warning" -fail-on-error="true"

  yamllint:
    needs: changes
    if: ${{ needs.changes.outputs.yaml_files == 'true' }}
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # reviewdog が github-pr-review でレビューコメントを投稿するために必要。
      pull-requests: write
    env:
      YAMLLINT_VERSION: 1.38.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install yamllint
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check "yamllint==${YAMLLINT_VERSION}"

      - name: Setup reviewdog
        uses: ./.github/actions/setup-reviewdog
        with:
          version: ${{ env.REVIEWDOG_VERSION }}
          sha256: ${{ env.REVIEWDOG_SHA256 }}

      - name: Run yamllint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m yamllint -f parsable . | "${RUNNER_TEMP}/reviewdog" -efm="%f:%l:%c: %m" -name="yamllint" -reporter="github-pr-review" -level="warning" -fail-on-error="true"

  woke:
    # 全ファイルが対象のため changes job による選別は行わず常に実行する。
    name: Woke (Inclusive Language Linter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # reviewdog が github-pr-review でレビューコメントを投稿するために必要。
      pull-requests: write
    env:
      WOKE_VERSION: 0.19.0
      WOKE_SHA256: db5ed0906c81323a8c478cc57e00301dbf184db7a0293d70ba9f4729b6169d8c
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup woke
        uses: ./.github/actions/setup-woke
        with:
          version: ${{ env.WOKE_VERSION }}
          sha256: ${{ env.WOKE_SHA256 }}

      - name: Setup reviewdog
        uses: ./.github/actions/setup-reviewdog
        with:
          version: ${{ env.REVIEWDOG_VERSION }}
          sha256: ${{ env.REVIEWDOG_SHA256 }}

      - name: Run woke with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "${RUNNER_TEMP}/woke" -o checkstyle . | "${RUNNER_TEMP}/reviewdog" -f=checkstyle -name="woke" -reporter="github-pr-review" -level="warning" -fail-on-error="true"

  textlint:
    needs: changes
    if: ${{ needs.changes.outputs.md == 'true' }}
    name: textlint
    runs-on: ubuntu-latest
    # reviewdog による PR レビューコメント投稿のための最小権限。
    permissions:
      contents: read
      pull-requests: write
    # 既存ドキュメントの違反を片付けるまでは赤検知にしない。
    # 整備完了後に continue-on-error を外して赤検知に切り替える。
    continue-on-error: true
    timeout-minutes: 5
    env:
      # ロックファイルを持たない ad-hoc install のため、再現性・サプライチェーン
      # リスク低減の観点でパッケージバージョンを明示的に固定する。
      TEXTLINT_VERSION: 15.8.0
      TEXTLINT_PRESET_JA_VERSION: 12.0.2
      TEXTLINT_FILTER_COMMENTS_VERSION: 1.3.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install textlint and presets
        run: |
          npm install \
            "textlint@${TEXTLINT_VERSION}" \
            "textlint-rule-preset-ja-technical-writing@${TEXTLINT_PRESET_JA_VERSION}" \
            "textlint-filter-rule-comments@${TEXTLINT_FILTER_COMMENTS_VERSION}" \
            --no-save

      - name: Setup reviewdog
        uses: ./.github/actions/setup-reviewdog
        with:
          version: ${{ env.REVIEWDOG_VERSION }}
          sha256: ${{ env.REVIEWDOG_SHA256 }}

      - name: Run textlint with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx textlint -f checkstyle "**/*.md" | "${RUNNER_TEMP}/reviewdog" -f=checkstyle -name="textlint" -reporter="github-pr-review" -level="warning" -fail-on-error="true"

  cspell:
    # 全ファイルが対象のため changes job による選別は行わず常に実行する。
    name: Check Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # PRへのコメント投稿は行わず、Actionsのアノテーションのみのため書き込み権限は不要。
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Spell Check
        uses: streetsidesoftware/cspell-action@de2a73e963e7443969755b648a1008f77033c5b2 # v8.4.0
        with:
          config: cspell.json
          inline: warning
          strict: false
