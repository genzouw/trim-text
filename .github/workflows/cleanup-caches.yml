name: Cleanup PR Caches

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    name: Cleanup PR caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Delete caches for PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Delete PR merge ref cache only. Deleting the head branch ref
          # cache was avoided because a single head branch can be the source
          # of multiple PRs targeting different base branches; closing one
          # of them would then delete caches still in use by another open
          # PR. Branch-scoped caches are naturally reclaimed by GitHub's
          # automatic eviction (unused for 7+ days, or storage limit).
          gh cache delete --all --ref "refs/pull/${PR_NUMBER}/merge" --succeed-on-no-caches
