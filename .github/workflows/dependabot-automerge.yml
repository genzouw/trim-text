name: Dependabot auto-merge

on: pull_request

# GITHUB_TOKEN の最小権限をワークフロー全体で読み取り専用にし、
# 必要なジョブだけが明示的に書き込み権限を付与する形にする
# (OpenSSF Scorecard Token-Permissions / alert #23)。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot:
    name: Dependabot 自動マージ
    runs-on: ubuntu-latest
    permissions:
      # Dependabot PRのメタデータ取得と自動マージ設定のため
      pull-requests: write
      # squash マージ実行のため
      contents: write
    # Dependabot が作成した PR のみで実行
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.type == 'Bot'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for Dependabot PRs
        # CI (他のチェック) が通った後に自動マージされるように設定
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        # GITHUB_TOKEN では自リポジトリの PR を approve できない (GitHub 側の仕様上の
        # 制限であり pull-requests: write を与えても解消しない)。approve はメンテナーの
        # 手動レビューに委ね、ここでは auto-merge の予約のみを行う。
        # 同方針は genzouw/hyakuninissyu の dependabot-auto-merge.yml でも採用している。
        run: |
          # リポジトリ設定で allow_merge_commit=false / required_linear_history=true のため
          # --merge ではなく --squash を使う（dependabot PR は通常 1 commit のため見た目は同じ）
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
