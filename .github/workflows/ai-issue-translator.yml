name: AI Issue Translator

on:
  issues:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write
  models: read

jobs:
  translate:
    name: Translate Issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Create Prompt File
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          cat << AI_TRANSLATOR_PROMPT_EOF > prompt.txt
          以下のGitHub Issueのタイトルと本文が日本語以外の言語で書かれているか判定し、日本語以外の場合は日本語に翻訳してください。

          【指示】
          1. Issueがすでに日本語で書かれている場合（大部分が日本語の場合）は、何も出力しないでください。空白または改行のみを出力してください。
          2. 日本語以外の言語（例：英語、中国語など）で書かれている場合は、タイトルと本文を日本語に翻訳して出力してください。
          3. 出力フォーマットは以下のようにしてください（マークダウン形式）。

          **【AIによる自動翻訳 / AI Auto Translation】**

          ### タイトル / Title
          <翻訳されたタイトル>

          ### 本文 / Body
          <翻訳された本文>

          ---
          *Note: This is an automated translation generated by AI.*

          【Issue タイトル】
          ${ISSUE_TITLE}

          【Issue 本文】
          ${ISSUE_BODY}
          AI_TRANSLATOR_PROMPT_EOF

      - name: Run AI Inference
        id: inference
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          model: openai/gpt-4o-mini
          prompt-file: prompt.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AI_RESPONSE: ${{ steps.inference.outputs.response }}
        run: |
          # 翻訳が必要ないと判定された場合（レスポンスが空の場合）はそのまま終了
          if [ -z "$(echo "${AI_RESPONSE}" | tr -d '[:space:]')" ]; then
            echo "Issue is already in Japanese or no translation needed."
          else
            MARKER="<!-- ai-issue-translator -->"
            COMMENT_BODY="${MARKER}
            ${AI_RESPONSE}
            "

            # 既存の翻訳コメントがあるか確認
            EXISTING_COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --paginate --jq "[.[] | select(.body | startswith(\"${MARKER}\"))][0].id // empty")

            if [ -n "${EXISTING_COMMENT_ID}" ]; then
              # 既存コメントを更新
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" -f body="${COMMENT_BODY}" || echo "Failed to update comment"
            else
              # 新規コメントを作成
              gh issue comment "${ISSUE_NUMBER}" --body "${COMMENT_BODY}" || echo "Failed to post comment"
            fi
          fi
