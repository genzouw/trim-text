name: AI Issue Translator

on:
  issues:
    types: [opened]

concurrency:
  group: ai-issue-translator-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  translate:
    name: Translate Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh -o install.sh
          sh install.sh

      - name: Start Ollama Server
        run: |
          ollama serve > ollama.log 2>&1 &
          while ! curl -s http://localhost:11434/api/tags > /dev/null; do
            sleep 1
          done

      - name: Pull Model
        run: |
          ollama pull qwen2.5:0.5b

      - name: Translate Issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          PROMPT="以下の GitHub Issue を日本語に翻訳してください。翻訳結果のみを出力してください。\n\nTitle: ${ISSUE_TITLE}\n\nBody: ${ISSUE_BODY}"
          JSON_PAYLOAD=$(jq -n --arg prompt "$PROMPT" --arg model "qwen2.5:0.5b" '{model: $model, prompt: $prompt, stream: false}')
          RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate -d "$JSON_PAYLOAD")
          TRANSLATION=$(echo "$RESPONSE" | jq -r '.response')
          if [ -z "$TRANSLATION" ] || [ "$TRANSLATION" = "null" ]; then
            echo "Error: Translation failed or empty response."
            # abort execution gracefully
            bash -c "exit 0"
          fi
          COMMENT_BODY=$(printf '### AI 自動翻訳 (Ollama - qwen2.5:0.5b)\n\n%s' "${TRANSLATION}")
          gh issue comment "${ISSUE_NUMBER}" -b "${COMMENT_BODY}" -R "${GH_REPO}"
