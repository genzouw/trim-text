name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # 毎週月曜 09:00 JST (= 00:00 UTC) に定期スキャンを実行する
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secrets scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commit 履歴を含めてスキャンするため fetch-depth: 0
          fetch-depth: 0
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      # gitleaks の版は ci-workflows の composite action の既定値に委ねる。
      # ここで版を直書きすると Renovate の更新対象から外れ、reusable workflow
      # (.github/workflows/gitleaks.yml) と検出ルールがずれたまま気づけない (#252)。
      # SHA は他の ci-workflows 参照と同じく Renovate (github-actions manager) が更新する。
      - name: Setup gitleaks
        uses: genzouw/ci-workflows/.github/actions/setup-gitleaks@171755af39e00e7aaad059a67e32294aef220106 # v1.5.7

      - name: Run gitleaks
        run: |
          gitleaks detect --no-banner --redact --verbose --source .

  trivy-fs:
    name: Trivy (filesystem vulnerability scan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRIVY_VERSION: 0.70.0
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Setup Trivy
        uses: ./.github/actions/setup-trivy # zizmor: ignore[self-repository]
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: Run Trivy filesystem scan
        run: |
          "${RUNNER_TEMP}/trivy" fs \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress \
            .
