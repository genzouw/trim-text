name: Dockle
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: dockle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dockle:
    name: Dockle (Container Image Linter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image
        run: docker buildx build --load --cache-to type=gha,mode=max --cache-from type=gha -t trim-text:ci .

      - name: Run Dockle
        uses: erzz/dockle-action@e8a7c41f36f1236ca3282b298d425ffbfdb2e922
        with:
          image: trim-text:ci
          exit-code: 1
          failure-threshold: FATAL
          dockle-version: "0.4.15"
