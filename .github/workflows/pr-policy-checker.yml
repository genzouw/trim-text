name: PR Policy Checker

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# 既定権限を最小限に絞り、ジョブごとに必要な権限のみ追加する。
permissions: {}

jobs:
  check-policy:
    name: Check PR Policy Compliance
    # Dependabot / release-please などの Bot が作成する PR は
    # PULL_REQUEST_TEMPLATE.md に沿わないため検査対象から除外する。
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # トークンの永続化を無効化し、後続ステップへの認証情報残存リスクを低減する。
          persist-credentials: false

      - name: Collect PR body and diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # 本文は env 経由で受け取り、run スクリプトへの直接埋め込みを避ける。
          printf '%s\n' "${PR_BODY}" >pr-body.md
          gh pr diff "${PR_NUMBER}" >pr.diff

      # 検査は決定的なシェルスクリプトで行う (AGENTS.md 4.1)。
      # ここでは終了コードを握り潰さず outputs へ記録し、結果の出力後に
      # 明示的なステップでジョブを失敗させる。
      - name: Run policy checks
        id: check
        run: |
          set -uo pipefail
          if bash .github/scripts/check-pr-policy.sh \
            --body pr-body.md --diff pr.diff --report pr-policy-report.md; then
            echo "status=pass" >>"${GITHUB_OUTPUT}"
          else
            echo "status=fail" >>"${GITHUB_OUTPUT}"
          fi

      - name: Write job summary
        if: always()
        run: cat pr-policy-report.md >>"${GITHUB_STEP_SUMMARY}"

      # フォークからの PR では GITHUB_TOKEN が読み取り専用になりコメントを
      # 投稿できないため、同一リポジトリ由来の PR に限定する。
      # フォーク PR でも上のジョブサマリと下の判定ステップで結果は確認できる。
      - name: Comment on PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- pr-policy-checker -->"
          { printf '%s\n' "${MARKER}"; cat pr-policy-report.md; } >comment.md

          # マーカーを騙った他者のコメントを掴まないよう github-actions[bot] の
          # 投稿に限定する。--paginate は --jq と併用できないため jq へ渡す。
          EXISTING_COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate --slurp |
            jq -r --arg marker "${MARKER}" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($marker)))][0].id // empty')

          if [ -n "${EXISTING_COMMENT_ID}" ]; then
            jq -n --rawfile body comment.md '{body: $body}' |
              gh api --method PATCH "repos/${GH_REPO}/issues/comments/${EXISTING_COMMENT_ID}" --input - >/dev/null
          else
            gh pr comment "${PR_NUMBER}" --body-file comment.md
          fi

      - name: Fail if required items are missing
        if: steps.check.outputs.status != 'pass'
        run: |
          echo "::error::PR の説明文が必須項目を満たしていません。ジョブサマリまたは PR コメントを確認してください。"
          exit 1
