# zizmor の設定
# 参考: https://docs.zizmor.sh/configuration/

rules:
  # labeler.yml は actions/labeler でフォーク PR にもラベルを付けるため
  # pull_request_target が必須。チェックアウトは persist-credentials: false
  # を設定済みで、PR 由来のコードを実行しない安全な構成のため抑止する。
  dangerous-triggers:
    ignore:
      - labeler.yml
      # semantic-pull-request.yml は amannn/action-semantic-pull-request で
      # フォーク PR のタイトルも検証し statuses への書き込みが必要なため
      # pull_request_target が必須。PR 由来のコードをチェックアウト・実行せず
      # PR タイトルを読むだけの安全な構成のため抑止する。
      - semantic-pull-request.yml
      # ai-pr-translator.yml はフォーク PR のタイトル・本文も翻訳対象にするため
      # pull_request_target が必須。チェックアウトを行わず、PR タイトル・本文は
      # env コンテキスト経由で受け渡す（run スクリプトへの直接埋め込みを避ける）
      # ことでスクリプトインジェクションを防いでおり、PR 由来のコードを
      # 実行しない安全な構成のため抑止する。
      - ai-pr-translator.yml
      # cleanup-caches.yml はフォーク PR クローズ時に Actions キャッシュを
      # 削除するため、書き込み権限（actions: write）を持つ pull_request_target
      # が必須（pull_request イベントではフォーク PR に対する GITHUB_TOKEN が
      # 読み取り専用になり削除できない）。チェックアウトは行わず、フォーク由来の
      # head.ref はベースリポジトリと同一の PR の場合のみ使用するようガード
      # 済みのため抑止する。
      - cleanup-caches.yml
