# zizmor の設定
# 参考: https://docs.zizmor.sh/configuration/

rules:
  # labeler.yml は actions/labeler でフォーク PR にもラベルを付けるため
  # pull_request_target が必須。チェックアウトは persist-credentials: false
  # を設定済みで、PR 由来のコードを実行しない安全な構成のため抑止する。
  dangerous-triggers:
    ignore:
      - labeler.yml
      # semantic-pull-request.yml は amannn/action-semantic-pull-request で
      # フォーク PR のタイトルも検証し statuses への書き込みが必要なため
      # pull_request_target が必須。PR 由来のコードをチェックアウト・実行せず
      # PR タイトルを読むだけの安全な構成のため抑止する。
      - semantic-pull-request.yml
      # ai-pr-translator.yml はフォーク PR のタイトル・本文も翻訳対象にするため
      # pull_request_target が必須。チェックアウトを行わず、PR タイトル・本文は
      # env コンテキスト経由で受け渡す（run スクリプトへの直接埋め込みを避ける）
      # ことでスクリプトインジェクションを防いでおり、PR 由来のコードを
      # 実行しない安全な構成のため抑止する。
      - ai-pr-translator.yml
      # cleanup-caches.yml はフォーク PR のキャッシュも削除できるよう
      # pull_request_target が必須（pull_request では GITHUB_TOKEN が
      # 読み取り専用になり actions: write 権限が付与されない）。
      # チェックアウトを行わず、PR 由来のコードは実行しない。head.ref は
      # 使用せず、github.event.pull_request.number（数値）から求めた
      # refs/pull/${PR_NUMBER}/merge のキャッシュのみを削除する構成で
      # あり、スクリプトインジェクションのリスクがない安全な構成の
      # ため抑止する。
      - cleanup-caches.yml
      # first-interaction.yml は初回 Issue/PR 作成者へ挨拶コメントを投稿するため
      # pull_request_target が必須（pull_request では GITHUB_TOKEN が読み取り専用に
      # なり issues/pull-requests への write 権限が付与されず、フォーク PR に
      # コメントできない）。チェックアウトを行わず、PR 由来のコードは実行しない。
      # gh api / gh issue comment / gh pr comment に渡す投稿者名・番号はすべて
      # env 経由で受け渡し、run スクリプトへの直接埋め込みを避けているため、
      # PR 由来のコードを実行しない安全な構成のため抑止する。
      - first-interaction.yml
