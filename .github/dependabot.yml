# Dependabot configuration for automatic dependency updates
# Reference: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions のバージョン更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    target-branch: main
    reviewers:
      - genzouw
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    pull-request-branch-name:
      separator: /
    # リリース直後の不安定なバージョンを避けるため、公開から一定日数が経過するまで
    # 更新 PR を作成しない (zizmor dependabot-cooldown)。
    cooldown:
      default-days: 7
    groups:
      # github/codeql-action は init / autobuild / analyze / upload-sarif が
      # 同一バージョンでないと "Loaded a configuration file for version 'X',
      # but running version 'Y'" で CodeQL が失敗する。サブパスごとに個別 PR が
      # 作られると必ずこの不整合が起きるため、1 つの PR にまとめる。
      codeql-action:
        patterns:
          - github/codeql-action*

  # Dockerfile のベースイメージ更新 (alpine など)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    target-branch: main
    reviewers:
      - genzouw
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: chore
      include: scope
    pull-request-branch-name:
      separator: /
    cooldown:
      default-days: 7
