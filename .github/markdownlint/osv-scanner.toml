# OSV-Scanner の除外設定 (この lockfile だけに効く)。
# 除外の条件と手順は docs/AI_AUTOMATION.md の「OSV-Scanner」を参照。
# reason と ignoreUntil は必須で、.github/scripts/check-osv-ignores.sh が CI で検査する。
# ignoreUntil を過ぎると除外が効かなくなり、OSV-Scanner が再び失敗する。
# そのときは上流の修正版の有無を確認し、あれば更新、無ければ影響を再評価して期限を延ばす。

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2027-01-03
reason = """
braces 3.0.3 (markdownlint-cli2 -> micromatch -> braces) の、深くネストしたブレースパターンによるスタック枯渇 (DoS)。\
2026-10-03 時点で修正版は無い (braces の最新は 3.0.3、markdownlint-cli2 の最新 0.23.3 も micromatch 4.0.8 に依存)。\
本リポジトリでは lint.yml の markdownlint ジョブでしか使わず、パターンの入力元はリポジトリ内の .markdownlint-cli2.jsonc だけ。\
悪用されても、そのパターンを書き換えた PR 自身の lint ジョブが落ちるだけで、配布物 (Docker イメージ) には含まれない。\
"""
