[default]
extend-ignore-re = [
  "(?Rm)^.*(#|//) typos:ignore.*$",
]

[files]
extend-exclude = [
  "node_modules",
  "dist",
  "build",
  "coverage",
  ".git",
  "*.lock",
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  "*.log",
  "*.png",
  "*.jpg",
  "*.jpeg",
  "*.gif",
  "*.svg",
  "*.ico",
  "*.pdf",
  "*.ttf",
  "*.woff",
  "*.woff2"
]
